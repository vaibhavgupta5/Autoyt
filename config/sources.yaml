# Channels to clip. Only PUBLIC videos are used (no login, no cookies, no members-only).
# Any public video in the channel's history can be picked, not just the latest.
#
# permission values (the loader refuses entries without one):
#   open_program_not_joined  creator runs a paid clipping program; we did NOT join it, so this is NOT a licence
#   joined_program | direct_written | creative_commons   lower-risk, use when you have it
#
# Optional per-source keys: min_minutes, max_minutes, tabs (videos, streams), title_include / title_exclude
# (regex lists), weight, layout (fit_blur | center_crop | custom), zoom, crop [x,y,w,h as 0-1 fractions].
#
# A claim, strike or takedown disables a source automatically (see `autoyt status`).

- name: The Iced Coffee Hour
  url: https://www.youtube.com/@TheIcedCoffeeHour
  credit: The Iced Coffee Hour
  categories: [informative]
  permission: open_program_not_joined
  layout: fit_blur
  enabled: true

