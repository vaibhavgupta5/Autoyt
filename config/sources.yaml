# ======================================================================================== GTA feed
# kind: gta6_talk      people talking about GTA 6 (news, breakdowns, opinions). Full screen, word captions,
#                      source speech only. Titles must mention GTA 6; trailer breakdowns and reactions are
#                      excluded because they carry Rockstar's trailer footage and licensed music.
# kind: gta6_gameplay  loud action moments from gameplay videos. Full screen, no captions, original audio.
#                      Until 18 Nov 2026 it uses GTA 5 / GTA Online footage, labelled "GTA 5" everywhere
#                      (`game_label`); from 19 Nov (GTA VI launch) it switches to GTA 6 footage by itself.
# Leaked or dev-build footage is never used whatever the title says (hard block in code).
# permission: fair_use_credit = commentary/news clipped with credit and a removal note (owner's decision).

- name: Mrbossftw (GTA 6 talk)
  url: https://www.youtube.com/@Mrbossftw
  credit: Mrbossftw
  kind: gta6_talk
  categories: [informative]
  title_include: ["GTA ?6", "GTA ?VI"]
  title_exclude: ["react", "reaction", "responds", "trailer"]
  min_minutes: 6
  max_minutes: 60
  max_items: 400      # recent uploads only: lighter listing
  permission: fair_use_credit
  enabled: true

